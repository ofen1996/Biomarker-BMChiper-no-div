[default]
base_dir = E:/bmk-stitch-test/tmp

[fov-cut]
camera_resolution = (2048, 2048)
if_raise_exception = True

[stitch]
overlap_x = 25
overlap_y = 35
x_range = 10
y_range = 10
resize_level = 2

[correct-whole-img]
use_real_kp_only = True
kp_detect_confidence = 0.5
debug = False
shift_x = -0.25
shift_y = 0.3
std_mask_color = (125, 125, 125)
calculate_size = 10000
max_out_size = 13000
compression_mode = "jpeg"

