[default]
machine = HDX
base_dir = E:/test
base_mode = S1000
mrxs_read_level = 1
std_d = auto

[fov-cut]
camera_resolution = (2448, 2048)
if_raise_exception = False

[stitch]
overlap_x = 25
overlap_y = 35
x_range = 10
y_range = 10
resize_level = 2

[match-imgs]
std_edge_size = (3048, 3048)
whole_img_size = (28060, 28009)
stitch_channal = 1
match_range = 40
auto_std_d_min = 10
auto_std_d_max = 40
auto_std_d_sub_rate = 10

[correct-whole-img]
use_real_kp_only = True
kp_detect_confidence = 0.45
kp_loc_confidence = 0.48
debug = True
shift_x = 0
shift_y = 0
std_mask_color = (125, 125, 125)
calculate_size = 10000
max_out_size = 20000
compression_mode = "jpeg"

