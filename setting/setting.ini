[default]
base_dir = D:/code/cell-seg/img

[fov-cut]
camera_resolution = (2448, 2048)
if_raise_exception = True

[stitch]
overlap_x = 25
overlap_y = 35
x_range = 10
y_range = 10
resize_level = 3

[match-imgs]
std_edge_size = (2248, 2648)
whole_img_size = (30000, 30000)
stitch_channal = 0

[correct-whole-img]
use_real_kp_only = True
kp_detect_confidence = 0.65
kp_loc_confidence = 0.56
debug = False
shift_x = -0.25
shift_y = 0.3
std_mask_color = (125, 125, 125)
calculate_size = 10000
max_out_size = 20000
compression_mode = "jpeg"

