[default]
base_dir = E:/biomarker_data/S2000
base_mode = S2000-2
mrxs_read_level = 2

[fov-cut]
camera_resolution = (2448, 2048)
if_raise_exception = True

[stitch]
overlap_x = 12
overlap_y = 6
x_range = 5
y_range = 5
resize_level = 1

[match-imgs]
std_edge_size = (2248, 2248)
whole_img_size = (41188, 31995)
stitch_channal = 1
match_range = 15

[correct-whole-img]
use_real_kp_only = True
kp_detect_confidence = 0.45
kp_loc_confidence = 0.45
debug = True
shift_x = -0.25
shift_y = 0.3
std_mask_color = (125, 125, 125)
calculate_size = 10000
max_out_size = 20000
compression_mode = "jpeg"

