[default]
base_dir = E:/test
base_mode = S1000
mrxs_read_level = 1

[fov-cut]
camera_resolution = (2048, 2048)
if_raise_exception = False

[stitch]
overlap_x = 100
overlap_y = 100
x_range = 50
y_range = 50
resize_level = 1

[match-imgs]
std_edge_size = (3048, 3048)
